<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0910" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Market State" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>Market State</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09070d;
      --surface: rgba(16, 13, 23, .94);
      --surface-strong: #121019;
      --surface-raised: #17131f;
      --text: #f7f2ff;
      --muted: #aaa1b8;
      --muted-2: #756d82;
      --purple: #8b5cf6;
      --purple-2: #a78bfa;
      --purple-dark: #6d28d9;
      --purple-soft: rgba(139, 92, 246, .16);
      --purple-softer: rgba(139, 92, 246, .08);
      --border: #2b2435;
      --border-strong: #3a2e49;
      --shadow: 0 22px 60px rgba(0, 0, 0, .42);
      --purple-glow: 0 0 34px rgba(139, 92, 246, .18);
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 15% 0%, rgba(139,92,246,.16), transparent 30rem),
        radial-gradient(circle at 100% 18%, rgba(109,40,217,.11), transparent 34rem),
        linear-gradient(180deg, #0b0810 0%, var(--bg) 38%, #07060a 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100svh;
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }

    button { font: inherit; }

    .app {
      width: min(1080px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .summary-card {
      position: sticky;
      top: max(12px, env(safe-area-inset-top));
      z-index: 10;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid rgba(167,139,250,.16);
      border-radius: var(--radius-xl);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow), var(--purple-glow);
    }

    .summary-accent {
      height: 5px;
      background: linear-gradient(90deg, var(--purple-dark), var(--purple), var(--purple-2));
    }

    .summary-inner { padding: 22px 24px 20px; }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .logo {
      flex: 0 0 auto;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 850;
      letter-spacing: -.04em;
      background: linear-gradient(145deg, var(--purple-dark), var(--purple-2));
      box-shadow: 0 10px 28px rgba(109,40,217,.35), 0 0 28px rgba(139,92,246,.14);
    }

    .brand-copy { min-width: 0; }
    .eyebrow {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 4vw, 30px);
      line-height: 1;
      letter-spacing: -.035em;
    }

    .reset {
      flex: 0 0 auto;
      min-height: 44px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface-raised);
      color: var(--muted);
      padding: 0 15px;
      font-weight: 750;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .reset:hover {
      border-color: var(--border-strong);
      color: var(--text);
      background: #1d1826;
    }

    .reset:active { transform: scale(.98); }

    .state-line {
      margin: 22px 0 0;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-size: clamp(17px, 3vw, 23px);
      font-weight: 800;
      letter-spacing: -.025em;
      line-height: 1.3;
    }

    .summary-chip {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--purple-soft);
      color: #d9ceff;
      border: 1px solid rgba(167,139,250,.15);
      white-space: nowrap;
    }

    .summary-chip.neutral {
      background: #18141f;
      color: var(--muted);
      border-color: var(--border);
    }

    .arrow {
      color: #655b73;
      font-size: .9em;
      font-weight: 900;
    }

    .summary-text {
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .updated {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-top: 10px;
      color: var(--muted-2);
      font-size: 12px;
      font-weight: 650;
    }

    .updated-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--purple);
      box-shadow: 0 0 0 4px var(--purple-soft), 0 0 14px rgba(139,92,246,.45);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .state-card {
      background: linear-gradient(180deg, #14111b 0%, var(--surface-strong) 100%);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: 0 14px 34px rgba(0,0,0,.28);
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .card-title {
      margin: 0;
      font-size: 14px;
      font-weight: 850;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .card-value {
      color: var(--purple-2);
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .card-value.neutral { color: var(--muted-2); }

    .segments {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .segment {
      min-height: 76px;
      appearance: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: #191520;
      color: #d3cadf;
      display: grid;
      place-items: center;
      padding: 10px 8px;
      font-size: clamp(15px, 2.4vw, 18px);
      font-weight: 800;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform .1s ease, background .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease;
    }

    .segment:hover { border-color: var(--border-strong); background: #1e1927; }
    .segment:active { transform: scale(.975); }

    .segment:focus-visible, .reset:focus-visible {
      outline: 2px solid var(--purple-2);
      outline-offset: 3px;
    }

    .segment.selected {
      color: #fff;
      border-color: transparent;
      background: linear-gradient(145deg, #6325c7, var(--purple));
      box-shadow: 0 12px 30px rgba(109,40,217,.36), 0 0 24px rgba(139,92,246,.15), inset 0 1px 0 rgba(255,255,255,.14);
    }

    .hint {
      margin: 0;
      padding: 2px 5px;
      color: var(--muted-2);
      text-align: center;
      font-size: 12px;
      line-height: 1.45;
    }

    @media (max-width: 670px) {
      body { padding-left: 12px; padding-right: 12px; }
      .grid { grid-template-columns: 1fr; }
      .summary-inner { padding: 18px; }
      .state-card { padding: 15px; }
      .segment { min-height: 68px; }
      .state-line { gap: 6px; }
      .summary-chip { min-height: 34px; padding: 6px 10px; }
    }

    @media (orientation: landscape) and (max-height: 700px) {
      body { padding-top: 10px; padding-bottom: 10px; }
      .app { gap: 12px; }
      .summary-inner { padding: 14px 18px 13px; }
      .logo { width: 36px; height: 36px; border-radius: 12px; }
      .state-line { margin-top: 13px; }
      .summary-text { margin-top: 8px; }
      .updated { margin-top: 7px; }
      .state-card { padding: 14px; }
      .segment { min-height: 58px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="summary-card" aria-live="polite">
      <div class="summary-accent"></div>
      <div class="summary-inner">
        <div class="topline">
          <div class="brand">
            <div class="logo" aria-hidden="true">MS</div>
            <div class="brand-copy">
              <p class="eyebrow">Live decision stack</p>
              <h1>Market State</h1>
            </div>
          </div>
          <button class="reset" id="resetBtn" type="button">Reset</button>
        </div>

        <div class="state-line" id="stateLine"></div>
        <p class="summary-text" id="summaryText"></p>
        <div class="updated"><span class="updated-dot"></span><span id="updatedText">Saved on this device</span></div>
      </div>
    </section>

    <section class="grid" id="stateGrid" aria-label="Market state controls"></section>

    <p class="hint">Tap a choice to select it. Tap the selected choice again to return that row to neutral. Your state is saved automatically on this device.</p>
  </main>

  <script>
    const STORAGE_KEY = 'dk-market-state-v1';

    const groups = [
      {
        id: 'htf',
        title: 'HTF Trend',
        summaryLabel: 'HTF',
        options: ['Bullish', 'Neutral', 'Bearish']
      },
      {
        id: 'regime',
        title: 'Regime',
        summaryLabel: 'Regime',
        options: ['Trend', 'Transition', 'Range']
      },
      {
        id: 'leg',
        title: 'Current Leg',
        summaryLabel: 'Leg',
        options: ['Up', 'Rotational', 'Down']
      },
      {
        id: 'lean',
        title: 'Lean',
        summaryLabel: 'Lean',
        options: ['Long', 'Neutral', 'Short']
      }
    ];

    const defaultState = Object.fromEntries(groups.map(g => [g.id, null]));
    let state = loadState();
    let lastUpdated = null;

    function loadState() {
      try {
        const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!parsed || typeof parsed !== 'object') return { ...defaultState };
        const clean = { ...defaultState };
        groups.forEach(group => {
          if (group.options.includes(parsed[group.id])) clean[group.id] = parsed[group.id];
        });
        return clean;
      } catch {
        return { ...defaultState };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      lastUpdated = new Date();
    }

    function displayValue(group) {
      return state[group.id] || 'Neutral';
    }

    function render() {
      const grid = document.getElementById('stateGrid');
      grid.innerHTML = '';

      groups.forEach(group => {
        const card = document.createElement('article');
        card.className = 'state-card';

        const head = document.createElement('div');
        head.className = 'card-head';

        const title = document.createElement('h2');
        title.className = 'card-title';
        title.textContent = group.title;

        const value = document.createElement('div');
        value.className = 'card-value' + (state[group.id] ? '' : ' neutral');
        value.textContent = displayValue(group);

        head.append(title, value);

        const segments = document.createElement('div');
        segments.className = 'segments';
        segments.setAttribute('role', 'group');
        segments.setAttribute('aria-label', group.title);

        group.options.forEach(option => {
          const button = document.createElement('button');
          button.className = 'segment' + (state[group.id] === option ? ' selected' : '');
          button.type = 'button';
          button.textContent = option;
          button.setAttribute('aria-pressed', state[group.id] === option ? 'true' : 'false');
          button.addEventListener('click', () => {
            state[group.id] = state[group.id] === option ? null : option;
            saveState();
            render();
          });
          segments.appendChild(button);
        });

        card.append(head, segments);
        grid.appendChild(card);
      });

      renderSummary();
    }

    function renderSummary() {
      const stateLine = document.getElementById('stateLine');
      stateLine.innerHTML = '';

      groups.forEach((group, index) => {
        const chip = document.createElement('span');
        chip.className = 'summary-chip' + (state[group.id] ? '' : ' neutral');
        chip.textContent = displayValue(group);
        stateLine.appendChild(chip);

        if (index < groups.length - 1) {
          const arrow = document.createElement('span');
          arrow.className = 'arrow';
          arrow.textContent = '→';
          arrow.setAttribute('aria-hidden', 'true');
          stateLine.appendChild(arrow);
        }
      });

      const readable = groups.map(group => `${group.summaryLabel}: ${displayValue(group)}`).join(' · ');
      document.getElementById('summaryText').textContent = readable;
      document.getElementById('updatedText').textContent = lastUpdated
        ? `Updated ${lastUpdated.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`
        : 'Saved on this device';
    }

    document.getElementById('resetBtn').addEventListener('click', () => {
      state = { ...defaultState };
      saveState();
      render();
    });

    render();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
